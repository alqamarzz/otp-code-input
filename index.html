<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Code Input</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111113;
      --surface-2: #18181b;
      --border: rgba(255,255,255,0.08);
      --border-focus: rgba(255,255,255,0.55);
      --border-active: rgba(255,255,255,0.85);
      --border-success: rgba(74,222,128,0.7);
      --text-primary: #f4f4f5;
      --text-secondary: rgba(244,244,245,0.4);
      --text-dim: rgba(244,244,245,0.22);
      --cursor: #ffffff;
      --glow-focus: rgba(255,255,255,0.06);
      --glow-success: rgba(74,222,128,0.08);
      --success: #4ade80;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 48px 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 32px 80px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4);
    }

    /* ── Header ──────────────────────────────────── */
    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .icon-ring {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .icon-ring.success {
      border-color: var(--border-success);
      box-shadow: 0 0 24px rgba(74,222,128,0.15);
    }
    .icon-ring svg {
      color: var(--text-secondary);
      transition: color 0.4s ease;
    }
    .icon-ring.success svg { color: var(--success); }

    .title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }
    .subtitle {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 260px;
    }

    /* ── OTP Row ─────────────────────────────────── */
    .otp-row {
      display: flex;
      gap: 10px;
      position: relative;
    }

    .otp-slot {
      position: relative;
      width: 52px;
      height: 60px;
      /* perspective for the flip */
      perspective: 300px;
    }

    /* The invisible real input sitting on top */
    .otp-slot input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: text;
      z-index: 10;
      font-size: 20px;
      caret-color: transparent;
    }

    /* The visible display box */
    .otp-display {
      position: absolute;
      inset: 0;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* smooth border & glow transitions */
      transition:
        border-color 0.22s ease,
        box-shadow 0.22s ease,
        transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ─ focus state ─ */
    .otp-slot.focused .otp-display {
      border-color: var(--border-focus);
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.06),
        0 0 18px rgba(255,255,255,0.03);
    }

    /* ─ filled (not focused) ─ */
    .otp-slot.filled .otp-display {
      border-color: rgba(255,255,255,0.18);
    }

    /* ─ focused + filled ─ */
    .otp-slot.focused.filled .otp-display {
      border-color: var(--border-active);
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.07),
        0 0 22px rgba(255,255,255,0.05);
    }

    /* ─ success ─ */
    .otp-slot.success .otp-display {
      border-color: var(--border-success);
      box-shadow:
        0 0 0 3px var(--glow-success),
        0 0 18px rgba(74,222,128,0.1);
      color: var(--success);
    }

    /* ── Digit slot scale-pulse on entry ─────────── */
    /*  The SLOT itself does a quick spring scale     */
    @keyframes slotPop {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.09); }
      60%  { transform: scale(0.97); }
      80%  { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    .otp-slot.slot-pop .otp-display {
      animation: slotPop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* ── Digit text: flip-in from top ────────────── */
    /*  Like a split-flap departure board — rotateX  */
    .digit-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .digit-char {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1;
      display: block;
      animation: flipIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      transform-origin: center bottom;
    }

    @keyframes flipIn {
      0% {
        opacity: 0;
        transform: translateY(-14px) rotateX(-60deg) scale(0.7);
      }
      55% {
        opacity: 1;
        transform: translateY(3px) rotateX(8deg) scale(1.05);
      }
      78% {
        transform: translateY(-2px) rotateX(-3deg) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) scale(1);
      }
    }

    /* ── Digit exit (backspace) ───────────────────── */
    .digit-char.exit {
      animation: flipOut 0.18s ease-in both;
    }

    @keyframes flipOut {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(8px) scale(0.75); }
    }

    /* ── Blinking cursor ─────────────────────────── */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 24px;
      background: var(--cursor);
      border-radius: 2px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Shake on error ──────────────────────────── */
    @keyframes shake {
      0%   { transform: translateX(0); }
      12%  { transform: translateX(-6px); }
      25%  { transform: translateX(6px); }
      37%  { transform: translateX(-5px); }
      50%  { transform: translateX(5px); }
      62%  { transform: translateX(-3px); }
      75%  { transform: translateX(3px); }
      87%  { transform: translateX(-1px); }
      100% { transform: translateX(0); }
    }
    .otp-row.shake {
      animation: shake 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Error flash border */
    .otp-slot.error-state .otp-display {
      border-color: rgba(248,113,113,0.7) !important;
      box-shadow: 0 0 0 3px rgba(248,113,113,0.08) !important;
    }

    /* ── Success stagger ─────────────────────────── */
    @keyframes successBounce {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.07); }
      65%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .otp-slot.success .otp-display {
      animation: successBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* ── Footer ──────────────────────────────────── */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .status-text {
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 18px;
      transition: color 0.3s ease;
      text-align: center;
    }
    .status-text.success { color: var(--success); }
    .status-text.error   { color: #f87171; }

    .resend-btn {
      font-size: 13px;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s ease, background 0.2s ease;
      font-family: inherit;
    }
    .resend-btn:hover {
      color: var(--text-secondary);
      background: rgba(255,255,255,0.04);
    }
    .resend-btn:active { color: var(--text-primary); }
  </style>
</head>
<body>

<div class="card">

  <div class="card-header">
    <div class="icon-ring" id="iconRing">
      <svg id="lockIcon" width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="3"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div class="title">Verification code</div>
    <div class="subtitle">Enter the 6-digit code we sent to your email address.</div>
  </div>

  <div class="otp-row" id="otpRow"></div>

  <div class="footer">
    <div class="status-text" id="statusText"></div>
    <button class="resend-btn" id="resendBtn">
      Didn't receive a code? <strong>Resend</strong>
    </button>
  </div>

</div>

<script>
  const LENGTH  = 6;
  const CORRECT = '123456'; // demo correct code

  const otpRow   = document.getElementById('otpRow');
  const statusEl = document.getElementById('statusText');
  const iconRing = document.getElementById('iconRing');
  const lockIcon = document.getElementById('lockIcon');
  const resendBtn = document.getElementById('resendBtn');

  let digits      = Array(LENGTH).fill('');
  let slots       = [];
  let inputs      = [];
  let focusedIdx  = -1;
  let isSuccess   = false;
  let isAnimating = false; // debounce during error animation

  /* ─────────────────────────────────────────────────
     Build slots
  ───────────────────────────────────────────────── */
  for (let i = 0; i < LENGTH; i++) {
    const slot    = document.createElement('div');
    slot.className = 'otp-slot';
    slot.dataset.index = i;

    const display = document.createElement('div');
    display.className = 'otp-display';
    display.id = `display-${i}`;

    const input = document.createElement('input');
    input.type        = 'text';
    input.inputMode   = 'numeric';
    input.maxLength   = 1;
    input.autocomplete = i === 0 ? 'one-time-code' : 'off';
    input.setAttribute('aria-label', `Digit ${i + 1}`);

    slot.appendChild(display);
    slot.appendChild(input);
    otpRow.appendChild(slot);

    slots.push(slot);
    inputs.push(input);

    input.addEventListener('focus',   () => onFocus(i));
    input.addEventListener('blur',    () => onBlur(i));
    input.addEventListener('keydown', (e) => onKeyDown(e, i));
    input.addEventListener('input',   (e) => onInput(e, i));
    input.addEventListener('paste',   (e) => onPaste(e, i));

    display.addEventListener('mousedown', (e) => {
      e.preventDefault();
      inputs[firstEmptyOrLast()].focus();
    });
  }

  /* ─────────────────────────────────────────────────
     Helpers
  ───────────────────────────────────────────────── */
  function firstEmptyOrLast() {
    for (let i = 0; i < LENGTH; i++) if (!digits[i]) return i;
    return LENGTH - 1;
  }

  /* Build the display content for slot i */
  function renderSlot(i, focusAt) {
    const slot    = slots[i];
    const display = document.getElementById(`display-${i}`);
    const focused = (i === focusAt);
    const filled  = !!digits[i];

    slot.classList.toggle('focused', focused);
    slot.classList.toggle('filled',  filled);

    if (filled) {
      display.innerHTML =
        `<div class="digit-wrap"><span class="digit-char">${digits[i]}</span></div>`;
    } else if (focused) {
      display.innerHTML = `<span class="cursor"></span>`;
    } else {
      display.innerHTML = '';
    }
  }

  function render(focusAt) {
    for (let i = 0; i < LENGTH; i++) renderSlot(i, focusAt);
  }

  /* Trigger the slot-scale-pop animation on slot i */
  function slotPop(i) {
    const s = slots[i];
    s.classList.remove('slot-pop');
    // Force reflow so the class is re-applied
    void s.offsetWidth;
    s.classList.add('slot-pop');
    setTimeout(() => s.classList.remove('slot-pop'), 400);
  }

  /* ─────────────────────────────────────────────────
     Events
  ───────────────────────────────────────────────── */
  function onFocus(i) {
    if (isSuccess) return;
    focusedIdx = i;
    statusEl.textContent = '';
    statusEl.className   = 'status-text';
    slots.forEach(s => s.classList.remove('error-state'));
    render(i);
  }

  function onBlur(i) {
    focusedIdx = -1;
    render(-1);
  }

  function onKeyDown(e, i) {
    if (isSuccess || isAnimating) { e.preventDefault(); return; }

    if (e.key === 'Backspace') {
      e.preventDefault();
      if (digits[i]) {
        // Animate out
        const display = document.getElementById(`display-${i}`);
        const span = display.querySelector('.digit-char');
        if (span) {
          span.classList.add('exit');
          setTimeout(() => {
            digits[i] = '';
            render(i);
          }, 160);
        } else {
          digits[i] = '';
          render(i);
        }
      } else if (i > 0) {
        const display = document.getElementById(`display-${i - 1}`);
        const span = display.querySelector('.digit-char');
        if (span) {
          span.classList.add('exit');
          setTimeout(() => {
            digits[i - 1] = '';
            inputs[i - 1].focus();
            render(i - 1);
          }, 160);
        } else {
          digits[i - 1] = '';
          inputs[i - 1].focus();
          render(i - 1);
        }
      }
    } else if (e.key === 'ArrowLeft' && i > 0) {
      e.preventDefault();
      inputs[i - 1].focus();
    } else if (e.key === 'ArrowRight' && i < LENGTH - 1) {
      e.preventDefault();
      inputs[i + 1].focus();
    } else if (e.key === 'Delete') {
      e.preventDefault();
      digits[i] = '';
      render(i);
    }
  }

  function onInput(e, i) {
    if (isSuccess || isAnimating) { e.target.value = ''; return; }

    const val = e.target.value.replace(/\D/g, '');
    e.target.value = '';
    if (!val) return;

    digits[i] = val[val.length - 1];

    // 1) Pop the slot scale
    slotPop(i);

    if (i < LENGTH - 1) {
      // Move focus then render new slot
      render(i + 1);
      inputs[i + 1].focus();
      // Re-render previous slot as filled (focus moved away)
      renderSlot(i, i + 1);
    } else {
      render(i);
      // Small delay so last flip animation is visible
      setTimeout(checkComplete, 80);
    }
  }

  function onPaste(e, startIdx) {
    e.preventDefault();
    if (isSuccess || isAnimating) return;

    const text  = (e.clipboardData || window.clipboardData).getData('text');
    const clean = text.replace(/\D/g, '').slice(0, LENGTH - startIdx);

    // Fill digits sequentially with staggered pop
    for (let j = 0; j < clean.length; j++) {
      const idx = startIdx + j;
      if (idx >= LENGTH) break;
      digits[idx] = clean[j];
      setTimeout(() => slotPop(idx), j * 55);
    }

    const nextEmpty = digits.indexOf('');
    const focusAt   = nextEmpty === -1 ? LENGTH - 1 : nextEmpty;

    setTimeout(() => {
      render(focusAt);
      inputs[focusAt].focus();
      if (digits.every(d => d !== '')) checkComplete();
    }, clean.length * 55 + 40);
  }

  /* ─────────────────────────────────────────────────
     Completion check
  ───────────────────────────────────────────────── */
  function checkComplete() {
    const code = digits.join('');
    if (code.length < LENGTH) return;
    if (code === CORRECT) triggerSuccess();
    else                   triggerError();
  }

  /* ─────────────────────────────────────────────────
     Success
  ───────────────────────────────────────────────── */
  function triggerSuccess() {
    isSuccess = true;

    slots.forEach((slot, i) => {
      setTimeout(() => {
        slot.classList.add('success');
        const display = document.getElementById(`display-${i}`);
        display.innerHTML =
          `<div class="digit-wrap"><span class="digit-char">${digits[i]}</span></div>`;
      }, i * 50);
    });

    setTimeout(() => {
      iconRing.classList.add('success');
      lockIcon.innerHTML = `
        <polyline points="20 6 9 17 4 12"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"/>
      `;
      statusEl.textContent = 'Code verified ✓';
      statusEl.className   = 'status-text success';
    }, LENGTH * 50 + 60);
  }

  /* ─────────────────────────────────────────────────
     Error
  ───────────────────────────────────────────────── */
  function triggerError() {
    isAnimating = true;

    otpRow.classList.add('shake');
    slots.forEach(s => s.classList.add('error-state'));

    statusEl.textContent = 'Incorrect code. Try again.';
    statusEl.className   = 'status-text error';

    setTimeout(() => {
      otpRow.classList.remove('shake');

      // Animate each digit out staggered
      slots.forEach((slot, i) => {
        setTimeout(() => {
          const display = document.getElementById(`display-${i}`);
          const span = display.querySelector('.digit-char');
          if (span) span.classList.add('exit');
        }, i * 35);
      });

      setTimeout(() => {
        digits = Array(LENGTH).fill('');
        isAnimating = false;
        slots.forEach(s => s.classList.remove('error-state'));
        render(0);
        inputs[0].focus();
      }, slots.length * 35 + 180);

    }, 480);
  }

  /* ─────────────────────────────────────────────────
     Resend
  ───────────────────────────────────────────────── */
  resendBtn.addEventListener('click', () => {
    if (isSuccess || isAnimating) return;
    digits = Array(LENGTH).fill('');
    render(0);
    inputs[0].focus();
    statusEl.textContent = 'New code sent!';
    statusEl.className   = 'status-text';
    setTimeout(() => {
      if (statusEl.textContent === 'New code sent!') statusEl.textContent = '';
    }, 2500);
  });

  /* ─────────────────────────────────────────────────
     Init
  ───────────────────────────────────────────────── */
  render(-1);
  setTimeout(() => inputs[0].focus(), 120);
</script>

</body>
</html>
