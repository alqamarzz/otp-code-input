<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Code Input - MetalForge Motion</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --canvas-bg: #F5F6F0;
      --capsule-bg: #FFFFFF;
      --slot-bg: #ECEFE8;
      --slot-err-bg: #FEE7EA;
      --text-color: #141414;
      --text-err-color: #E5354C;
      --active-border: #141414;
      --border-thickness: 3.5px;
      --shadow-capsule: 0 16px 40px -8px rgba(0, 0, 0, 0.07), 0 4px 16px -2px rgba(0, 0, 0, 0.04);
    }

    body {
      background-color: var(--canvas-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    /* Container wrapper */
    .capsule-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer white pill */
    .capsule {
      position: relative;
      background: var(--capsule-bg);
      box-shadow: var(--shadow-capsule);
      border-radius: 9999px;
      height: 98px;
      width: 536px;
      padding: 10px;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      transition: width 0.52s cubic-bezier(0.34, 1.4, 0.64, 1),
                  transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: text;
    }

    .capsule.shrunk {
      width: 250px;
    }

    /* Slots track */
    .slots-track {
      position: relative;
      display: flex;
      gap: 10px;
      width: 100%;
      height: 100%;
      align-items: center;
      transition: opacity 0.28s ease, transform 0.35s cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    .capsule.shrunk .slots-track {
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
      position: absolute;
    }

    /* Slot base geometry */
    .slot {
      position: relative;
      flex: 1;
      height: 100%;
      background: var(--slot-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 590;
      color: var(--text-color);
      transition: background-color 0.25s ease, color 0.25s ease;
      z-index: 2;

      /* Middle slots have standard corner radius */
      border-radius: 18px;
    }

    /* Slot 0: Left side is semi-circular (matches capsule outer boundary) */
    .slot:first-child {
      border-radius: 39px 18px 18px 39px;
    }

    /* Slot 5: Right side is semi-circular */
    .slot:last-child {
      border-radius: 18px 39px 39px 18px;
    }

    /* Sliding active indicator ring
       Uses absolute positioning relative to .slots-track
       Matches the exact slot bounds with zero gap/bleed
    */
    .active-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 5;
      border: var(--border-thickness) solid var(--active-border);
      /* Fluid iOS spring transition */
      transition: transform 0.32s cubic-bezier(0.34, 1.35, 0.64, 1),
                  border-radius 0.28s ease,
                  width 0.28s ease,
                  opacity 0.2s ease;
    }

    /* Shape adaptation matching the active slot's exact border radius */
    .active-indicator.pos-first {
      border-radius: 39px 18px 18px 39px;
    }

    .active-indicator.pos-middle {
      border-radius: 18px;
    }

    .active-indicator.pos-last {
      border-radius: 18px 39px 39px 18px;
    }

    .active-indicator.hidden {
      opacity: 0;
    }

    /* Blinking vertical cursor */
    .cursor-line {
      width: 2.5px;
      height: 38px;
      background: var(--text-color);
      border-radius: 2px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Digit entry animation */
    .digit-val {
      display: inline-block;
      animation: digitEnter 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.2) both;
    }

    @keyframes digitEnter {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(-6px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Hidden input */
    #hiddenInput {
      position: absolute;
      opacity: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: text;
    }

    /* Status Pill (Verifying / Verified) */
    .status-view {
      position: absolute;
      inset: 10px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
      background: var(--slot-bg);
      color: var(--text-color);
      font-size: 23px;
      font-weight: 590;
      letter-spacing: -0.3px;
      transition: opacity 0.3s ease 0.15s,
                  transform 0.4s cubic-bezier(0.34, 1.45, 0.64, 1) 0.15s,
                  background 0.4s ease,
                  color 0.4s ease;
      z-index: 6;
    }

    .capsule.shrunk .status-view {
      opacity: 1;
      transform: scale(1);
    }

    /* Spinner */
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(0, 0, 0, 0.12);
      border-top-color: var(--text-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Verified Green Pill */
    .status-view.verified-state {
      background: linear-gradient(115deg, #23C152 0%, #30D261 45%, #6BE78E 58%, #29C657 72%, #20BC4E 100%);
      background-size: 200% 100%;
      animation: sheenPass 1.2s ease-out forwards;
      color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(39, 200, 88, 0.35);
    }

    @keyframes sheenPass {
      0% { background-position: 180% 0; }
      100% { background-position: 0% 0; }
    }

    .check-icon {
      width: 26px;
      height: 26px;
      stroke: #FFFFFF;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      animation: checkPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes checkPop {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Error Shake & Red Flush */
    @keyframes capsuleShake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-10px); }
      30% { transform: translateX(10px); }
      45% { transform: translateX(-7px); }
      60% { transform: translateX(7px); }
      75% { transform: translateX(-3px); }
      90% { transform: translateX(3px); }
    }

    .capsule.shake {
      animation: capsuleShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .slot.error-red {
      background: var(--slot-err-bg) !important;
      color: var(--text-err-color) !important;
      transition: background 0.18s ease, color 0.18s ease;
    }

    /* Subtext Helper */
    .hint-label {
      margin-top: 36px;
      font-size: 14px;
      color: #8E9189;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hint-badge {
      background: #E4E8DF;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="capsule-wrapper">
    <input type="text" id="hiddenInput" inputmode="numeric" maxlength="6" autocomplete="one-time-code" autofocus />
    
    <div class="capsule" id="capsule">
      <!-- 6 OTP Gray Slots + Sliding Indicator inside same track -->
      <div class="slots-track" id="slotsTrack">
        <!-- The sliding active black ring -->
        <div class="active-indicator pos-first" id="activeIndicator"></div>

        <div class="slot" data-index="0"></div>
        <div class="slot" data-index="1"></div>
        <div class="slot" data-index="2"></div>
        <div class="slot" data-index="3"></div>
        <div class="slot" data-index="4"></div>
        <div class="slot" data-index="5"></div>
      </div>

      <!-- Status Pill View (Verifying / Verified) -->
      <div class="status-view" id="statusView">
        <div class="spinner" id="spinner"></div>
        <span id="statusLabel">Verifying</span>
      </div>
    </div>
  </div>

  <div class="hint-label">
    Demo: Type any wrong code to test <span class="hint-badge">Error Shake</span>, or <span class="hint-badge">123456</span> for <span class="hint-badge">Verified</span>
  </div>

  <script>
    const LENGTH = 6;
    const CORRECT_CODE = "123456";

    const capsule = document.getElementById("capsule");
    const hiddenInput = document.getElementById("hiddenInput");
    const activeIndicator = document.getElementById("activeIndicator");
    const slotsTrack = document.getElementById("slotsTrack");
    const slots = Array.from(document.querySelectorAll(".slot"));
    const statusView = document.getElementById("statusView");
    const statusLabel = document.getElementById("statusLabel");
    const spinner = document.getElementById("spinner");

    let digits = Array(LENGTH).fill("");
    let isProcessing = false;

    // Focus input on click anywhere
    document.body.addEventListener("click", () => {
      if (!isProcessing) hiddenInput.focus();
    });

    // Update position and curvature of the indicator precisely
    function updateActiveIndicator() {
      const idx = Math.min(digits.filter(d => d !== "").length, LENGTH - 1);
      const isComplete = digits.every(d => d !== "");

      if (isComplete || isProcessing) {
        activeIndicator.classList.add("hidden");
        return;
      }

      activeIndicator.classList.remove("hidden");
      const targetSlot = slots[idx];

      // Exact pixel measurements from slot relative to slotsTrack
      const left = targetSlot.offsetLeft;
      const width = targetSlot.offsetWidth;

      activeIndicator.style.transform = `translateX(${left}px)`;
      activeIndicator.style.width = `${width}px`;

      // Set class for exact border-radius match
      activeIndicator.classList.remove("pos-first", "pos-middle", "pos-last");
      if (idx === 0) {
        activeIndicator.classList.add("pos-first");
      } else if (idx === LENGTH - 1) {
        activeIndicator.classList.add("pos-last");
      } else {
        activeIndicator.classList.add("pos-middle");
      }
    }

    // Render slots contents and cursor
    function render() {
      const filledCount = digits.filter(d => d !== "").length;

      slots.forEach((slot, i) => {
        if (digits[i] !== "") {
          slot.innerHTML = `<span class="digit-val">${digits[i]}</span>`;
        } else if (i === filledCount && !isProcessing) {
          slot.innerHTML = `<div class="cursor-line"></div>`;
        } else {
          slot.innerHTML = "";
        }
      });

      updateActiveIndicator();
    }

    // Keystroke handling
    hiddenInput.addEventListener("input", (e) => {
      if (isProcessing) return;

      const rawVal = e.target.value.replace(/\D/g, "").slice(0, LENGTH);
      e.target.value = rawVal;

      for (let i = 0; i < LENGTH; i++) {
        digits[i] = rawVal[i] || "";
      }

      render();

      if (rawVal.length === LENGTH) {
        handleComplete(rawVal);
      }
    });

    // Full Verification Sequence
    function handleComplete(code) {
      isProcessing = true;
      activeIndicator.classList.add("hidden");
      hiddenInput.blur();

      if (code === CORRECT_CODE) {
        // SUCCESS:
        setTimeout(() => {
          capsule.classList.add("shrunk");
          statusView.classList.remove("verified-state");
          spinner.style.display = "block";
          statusLabel.textContent = "Verifying";
        }, 160);

        setTimeout(() => {
          spinner.style.display = "none";
          statusView.classList.add("verified-state");
          statusView.innerHTML = `
            <svg class="check-icon" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Verified</span>
          `;
        }, 1300);

        setTimeout(() => {
          resetAll();
        }, 3400);

      } else {
        // ERROR:
        setTimeout(() => {
          slots.forEach(s => s.classList.add("error-red"));
          capsule.classList.add("shake");
        }, 120);

        setTimeout(() => {
          capsule.classList.remove("shake");
        }, 600);

        setTimeout(() => {
          digits.forEach((_, i) => {
            const digitEl = slots[i].querySelector(".digit-val");
            if (digitEl) {
              setTimeout(() => {
                digitEl.style.transition = "opacity 0.22s ease, transform 0.22s ease";
                digitEl.style.opacity = "0";
                digitEl.style.transform = "translateY(8px) scale(0.8)";
              }, (LENGTH - 1 - i) * 45);
            }
          });
        }, 900);

        setTimeout(() => {
          resetAll();
        }, 1450);
      }
    }

    function resetAll() {
      digits = Array(LENGTH).fill("");
      hiddenInput.value = "";
      slots.forEach(s => {
        s.className = "slot";
        s.innerHTML = "";
      });
      capsule.classList.remove("shrunk", "shake");
      statusView.classList.remove("verified-state");
      statusView.innerHTML = `
        <div class="spinner" id="spinner"></div>
        <span id="statusLabel">Verifying</span>
      `;
      isProcessing = false;
      render();
      hiddenInput.focus();
    }

    // Init
    window.addEventListener("DOMContentLoaded", () => {
      render();
      setTimeout(() => hiddenInput.focus(), 100);
    });
    window.addEventListener("resize", updateActiveIndicator);
  </script>
</body>
</html>
