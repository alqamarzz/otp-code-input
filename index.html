<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Code Input</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111113;
      --surface-2: #18181b;
      --border: rgba(255,255,255,0.08);
      --border-focus: rgba(255,255,255,0.55);
      --border-active: rgba(255,255,255,0.85);
      --border-success: rgba(74,222,128,0.7);
      --text-primary: #f4f4f5;
      --text-secondary: rgba(244,244,245,0.4);
      --text-dim: rgba(244,244,245,0.25);
      --cursor: #ffffff;
      --glow-focus: rgba(255,255,255,0.06);
      --glow-success: rgba(74,222,128,0.08);
      --success: #4ade80;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 48px 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 32px 80px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4);
    }

    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .icon-ring {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .icon-ring.success {
      border-color: var(--border-success);
      box-shadow: 0 0 20px rgba(74,222,128,0.15);
    }

    .icon-ring svg {
      color: var(--text-secondary);
      transition: color 0.35s ease;
    }

    .icon-ring.success svg {
      color: var(--success);
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 260px;
    }

    /* OTP Input Row */
    .otp-row {
      display: flex;
      gap: 10px;
      position: relative;
    }

    .otp-slot {
      position: relative;
      width: 50px;
      height: 58px;
    }

    .otp-slot input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: text;
      z-index: 10;
      font-size: 20px;
    }

    .otp-display {
      position: absolute;
      inset: 0;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease,
        transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
      user-select: none;
      overflow: hidden;
    }

    .otp-display::after {
      /* Subtle inner highlight at top */
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: rgba(255,255,255,0.05);
      border-radius: 100%;
    }

    /* Focus state */
    .otp-slot.focused .otp-display {
      border-color: var(--border-focus);
      box-shadow:
        0 0 0 3px var(--glow-focus),
        0 0 20px rgba(255,255,255,0.04);
      background: var(--surface-2);
    }

    /* Filled state */
    .otp-slot.filled .otp-display {
      border-color: rgba(255,255,255,0.2);
    }

    /* Focused + filled */
    .otp-slot.focused.filled .otp-display {
      border-color: var(--border-active);
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.07),
        0 0 24px rgba(255,255,255,0.05);
    }

    /* Success */
    .otp-slot.success .otp-display {
      border-color: var(--border-success);
      box-shadow:
        0 0 0 3px var(--glow-success),
        0 0 20px rgba(74,222,128,0.1);
      color: var(--success);
    }

    /* Pop animation when digit is entered */
    .otp-slot.pop .otp-display {
      transform: scale(1.07);
    }

    /* The blinking cursor */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 22px;
      background: var(--cursor);
      border-radius: 2px;
      animation: blink 1s step-end infinite;
      position: absolute;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Character animation: slide up in */
    .digit-char {
      display: inline-block;
      animation: slideUp 0.18s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(6px) scale(0.85);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Shake animation on error */
    @keyframes shake {
      0%   { transform: translateX(0); }
      15%  { transform: translateX(-5px); }
      30%  { transform: translateX(5px); }
      45%  { transform: translateX(-4px); }
      60%  { transform: translateX(4px); }
      75%  { transform: translateX(-2px); }
      90%  { transform: translateX(2px); }
      100% { transform: translateX(0); }
    }

    .otp-row.shake {
      animation: shake 0.45s cubic-bezier(0.36,0.07,0.19,0.97) both;
    }

    /* Success bounce */
    @keyframes successPop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.06); }
      70%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    .otp-slot.success .otp-display {
      animation: successPop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    /* Footer */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .status-text {
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 18px;
      transition: color 0.3s ease;
    }

    .status-text.success {
      color: var(--success);
    }

    .status-text.error {
      color: #f87171;
    }

    .resend-btn {
      font-size: 13px;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s ease, background 0.2s ease;
      font-family: inherit;
    }

    .resend-btn:hover {
      color: var(--text-secondary);
      background: rgba(255,255,255,0.04);
    }

    .resend-btn:active {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="icon-ring" id="iconRing">
      <svg id="lockIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="3"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div class="title">Verification code</div>
    <div class="subtitle">Enter the 6-digit code we sent to your email address.</div>
  </div>

  <div class="otp-row" id="otpRow">
    <!-- Slots generated by JS -->
  </div>

  <div class="footer">
    <div class="status-text" id="statusText"></div>
    <button class="resend-btn" id="resendBtn">Didn't receive a code? <strong>Resend</strong></button>
  </div>
</div>

<script>
  const LENGTH = 6;
  // Demo: correct code is 123456
  const CORRECT = '123456';

  const otpRow   = document.getElementById('otpRow');
  const statusEl = document.getElementById('statusText');
  const iconRing = document.getElementById('iconRing');
  const lockIcon = document.getElementById('lockIcon');
  const resendBtn = document.getElementById('resendBtn');

  let digits = Array(LENGTH).fill('');
  let slots  = [];
  let inputs = [];
  let focusedIndex = -1;
  let isSuccess = false;

  /* ─── Build slots ─────────────────────────────────── */
  for (let i = 0; i < LENGTH; i++) {
    const slot = document.createElement('div');
    slot.className = 'otp-slot';
    slot.dataset.index = i;

    const display = document.createElement('div');
    display.className = 'otp-display';
    display.id = `display-${i}`;

    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.maxLength = 1;
    input.autocomplete = i === 0 ? 'one-time-code' : 'off';
    input.setAttribute('aria-label', `Digit ${i + 1}`);

    slot.appendChild(display);
    slot.appendChild(input);
    otpRow.appendChild(slot);

    slots.push(slot);
    inputs.push(input);

    /* Events */
    input.addEventListener('focus', () => onFocus(i));
    input.addEventListener('blur',  () => onBlur(i));
    input.addEventListener('keydown', (e) => onKeyDown(e, i));
    input.addEventListener('input',   (e) => onInput(e, i));
    input.addEventListener('paste',   (e) => onPaste(e, i));

    /* Click on display focuses input */
    display.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const target = firstEmptyOrLast();
      inputs[target].focus();
    });
  }

  /* ─── Helpers ─────────────────────────────────────── */
  function firstEmptyOrLast() {
    for (let i = 0; i < LENGTH; i++) {
      if (!digits[i]) return i;
    }
    return LENGTH - 1;
  }

  function render(focusIdx) {
    for (let i = 0; i < LENGTH; i++) {
      const slot    = slots[i];
      const display = document.getElementById(`display-${i}`);

      // Classes
      slot.classList.toggle('focused', i === focusIdx);
      slot.classList.toggle('filled',  !!digits[i]);

      // Content
      if (digits[i]) {
        display.innerHTML = `<span class="digit-char">${digits[i]}</span>`;
      } else if (i === focusIdx) {
        display.innerHTML = `<span class="cursor"></span>`;
      } else {
        display.innerHTML = '';
      }
    }
  }

  function onFocus(i) {
    if (isSuccess) return;
    focusedIndex = i;
    statusEl.textContent = '';
    statusEl.className = 'status-text';
    render(i);
  }

  function onBlur(i) {
    focusedIndex = -1;
    render(-1);
  }

  function popSlot(i) {
    slots[i].classList.add('pop');
    setTimeout(() => slots[i].classList.remove('pop'), 200);
  }

  function onKeyDown(e, i) {
    if (isSuccess) { e.preventDefault(); return; }

    if (e.key === 'Backspace') {
      e.preventDefault();
      if (digits[i]) {
        digits[i] = '';
        render(i);
      } else if (i > 0) {
        digits[i - 1] = '';
        inputs[i - 1].focus();
        render(i - 1);
      }
    } else if (e.key === 'ArrowLeft' && i > 0) {
      e.preventDefault();
      inputs[i - 1].focus();
    } else if (e.key === 'ArrowRight' && i < LENGTH - 1) {
      e.preventDefault();
      inputs[i + 1].focus();
    } else if (e.key === 'Delete') {
      e.preventDefault();
      digits[i] = '';
      render(i);
    }
  }

  function onInput(e, i) {
    if (isSuccess) { e.target.value = ''; return; }

    const val = e.target.value.replace(/\D/g, '');
    e.target.value = '';

    if (!val) return;

    digits[i] = val[val.length - 1]; // only last digit typed
    popSlot(i);

    if (i < LENGTH - 1) {
      render(i + 1);
      inputs[i + 1].focus();
    } else {
      render(i);
      checkComplete();
    }
  }

  function onPaste(e, startIdx) {
    e.preventDefault();
    if (isSuccess) return;
    const text  = (e.clipboardData || window.clipboardData).getData('text');
    const clean = text.replace(/\D/g, '').slice(0, LENGTH);

    for (let j = 0; j < clean.length; j++) {
      const idx = startIdx + j;
      if (idx >= LENGTH) break;
      digits[idx] = clean[j];
    }

    const nextEmpty = digits.indexOf('');
    const focusAt   = nextEmpty === -1 ? LENGTH - 1 : nextEmpty;
    render(focusAt);
    inputs[focusAt].focus();

    if (digits.every(d => d !== '')) {
      checkComplete();
    }
  }

  function checkComplete() {
    const code = digits.join('');
    if (code.length < LENGTH) return;

    if (code === CORRECT) {
      triggerSuccess();
    } else {
      triggerError();
    }
  }

  function triggerSuccess() {
    isSuccess = true;

    // Staggered success classes
    slots.forEach((slot, i) => {
      setTimeout(() => {
        slot.classList.add('success');
        const display = document.getElementById(`display-${i}`);
        display.innerHTML = `<span class="digit-char">${digits[i]}</span>`;
      }, i * 45);
    });

    setTimeout(() => {
      iconRing.classList.add('success');
      lockIcon.innerHTML = `
        <polyline points="20 6 9 17 4 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      `;
    }, 200);

    statusEl.textContent = 'Code verified ✓';
    statusEl.className = 'status-text success';
  }

  function triggerError() {
    otpRow.classList.add('shake');
    setTimeout(() => otpRow.classList.remove('shake'), 500);

    statusEl.textContent = 'Incorrect code. Try again.';
    statusEl.className = 'status-text error';

    // Flash red border
    slots.forEach(slot => {
      slot.classList.add('error-flash');
    });

    setTimeout(() => {
      // Clear digits and refocus
      digits = Array(LENGTH).fill('');
      isSuccess = false;
      render(0);
      inputs[0].focus();
      slots.forEach(slot => slot.classList.remove('error-flash'));
    }, 700);
  }

  /* ─── Resend ─────────────────────────────────────── */
  resendBtn.addEventListener('click', () => {
    if (isSuccess) return;
    digits = Array(LENGTH).fill('');
    statusEl.textContent = 'Code resent!';
    statusEl.className = 'status-text';
    render(0);
    inputs[0].focus();
    setTimeout(() => {
      if (statusEl.textContent === 'Code resent!') {
        statusEl.textContent = '';
      }
    }, 2500);
  });

  /* ─── Auto-focus ─────────────────────────────────── */
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => inputs[0].focus(), 100);
  });

  // Initial render
  render(-1);
</script>

</body>
</html>
